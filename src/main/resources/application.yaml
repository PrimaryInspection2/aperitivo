spring:
  application:
    name: aperitivo

  # Local secrets live in .env (git-ignored, shared with Docker Compose).
  # The [.properties] hint is required: Boot does not recognise ".env" as a
  # loadable extension on its own. "optional:" keeps deployments working where
  # the values arrive as real environment variables instead.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aperitivo}
    username: ${POSTGRES_USER:aperitivo}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  modulith:
    runtime:
      flyway-enabled: true
      verification-enabled: true
    events:
      jdbc:
        schema-initialization:
          enabled: false

  cloud:
    openfeign:
      # Apache HttpClient 5 with a real connection pool.
      # Enabled via the feign-hc5 dependency in pom.xml.
      httpclient:
        hc5:
          enabled: true
        max-connections: ${FEIGN_MAX_CONNECTIONS:200}
        max-connections-per-route: ${FEIGN_MAX_CONNECTIONS_PER_ROUTE:100}
        # Idle-connection eviction (seconds) — recycle stale sockets.
        time-to-live: ${FEIGN_TTL_SECONDS:300}
        # Socket connect timeout when a new pooled connection is created (ms).
        connection-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:3000}
      client:
        config:
          # Global defaults for all Feign clients.
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:10000}
          # Strava OAuth token exchange / refresh.
          # Timings MUST fit inside aperitivo.identity.token-refresh-lock.lease-time
          # so the Redis lock cannot expire mid-call. Worst case here:
          #   connect (3s) + read (8s) = 11s, versus lease-time 15s → 4s margin.
          strava-oauth:
            connect-timeout: ${STRAVA_OAUTH_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${STRAVA_OAUTH_READ_TIMEOUT_MS:8000}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          strava:
            client-id: ${STRAVA_CLIENT_ID}
            client-secret: ${STRAVA_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Strava
            redirect-uri: "{baseUrl}/connect/oauth2/code/{registrationId}"
            scope:
              - read
              - activity:read_all
              - profile:read_all
        provider:
          google:
            issuer-uri: https://accounts.google.com
          strava:
            authorization-uri: https://www.strava.com/oauth/authorize
            token-uri: https://www.strava.com/oauth/token

# No OTel collector runs locally, so the exporters would retry-and-log forever.
# Opt-in per environment; production flips these on (docs/operations/observability.md).
# Prometheus is unaffected — it scrapes /actuator/prometheus rather than being pushed to.
management:
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
    tracing:
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}
    logging:
      export:
        enabled: ${OTLP_LOGS_ENABLED:false}

aperitivo:
  provider:
    strava:
      api:
        url: https://www.strava.com/api/v3
  identity:
    jwt:
      public-key: ${JWT_PUBLIC_KEY}
      private-key: ${JWT_PRIVATE_KEY}
      key-id: ${JWT_KEY_ID}
      issuer: aperitivo.app
      audience: aperitivo-api
    login:
      registration-id: ${IAM_LOGIN_REGISTRATION_ID:google}
    encryption:
      key: ${AES_GCM_SECRET}
    token-refresh:
      expiration-buffer: ${IAM_TOKEN_EXPIRATION_BUFFER:60s}
      retry:
        max-attempts: ${IAM_RETRY_MAX_ATTEMPTS:3}
        initial-delay-ms: ${IAM_RETRY_INITIAL_DELAY_MS:50}
        multiplier: ${IAM_RETRY_MULTIPLIER:2.0}
    token-refresh-lock:
      wait-time: ${TOKEN_REFRESH_LOCK_WAIT:5s}
      lease-time: ${TOKEN_REFRESH_LOCK_LEASE:15s}
    audit-executor:
      core-pool-size: ${IAM_AUDIT_CORE_POOL_SIZE:2}
      max-pool-size: ${IAM_AUDIT_MAX_POOL_SIZE:4}
      queue-capacity: ${IAM_AUDIT_QUEUE_CAPACITY:500}
      thread-name-prefix: iam-audit-

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: TRACE